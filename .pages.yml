media:
  input: public/uploads
  output: /uploads
content:
  - name: posts
    label: 블로그 글
    type: collection
    path: src/content/posts
    format: yaml-frontmatter
    subfolders: false
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    view:
      primary: title
      fields: [title, createdAt, category, draft]
      sort: createdAt
      order: desc
    fields:
      - name: title
        label: 제목
        type: string
        required: true
      - name: subtitle
        label: 부제목
        type: text
      - name: createdAt
        label: 첫 작성일
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: category
        label: 카테고리
        type: reference
        required: true
        options:
          collection: categories
          value: "{fields.key}"
          label: "{fields.title}"
          search: title
      - name: draft
        label: 초안 (사이트에 표시하지 않음)
        type: boolean
        default: true
      - name: body
        label: 본문
        type: rich-text
        options:
          format: markdown
  - name: categories
    label: 카테고리
    type: collection
    path: src/content/categories
    format: json
    subfolders: false
    filename: "{fields.key}.json"
    view:
      primary: title
      sort: order
    fields:
      - name: key
        label: 식별자 (영문 소문자·숫자·하이픈, all 제외)
        type: string
        required: true
      - name: title
        label: 이름
        type: string
        required: true
      - name: image
        label: 로고 이미지 (새 카테고리용)
        type: image
      - name: style
        label: 기존 로고 서체
        type: select
        default: weblog
        options:
          values: ["", ugcatalog, bukichi, toys, amenorica, weblog]
      - name: order
        label: 표시 순서
        type: number
        default: 0
